<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Page - Car Finder</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-lg">
                <div class="card-header bg-primary text-white text-center">
                    <h3>Welcome to Car Finder</h3>
                </div>
                <div class="card-body">
                    <h5 class="card-title text-center">Search for a Car by VIN</h5>

                    <form action="/search" method="get">
                        <div class="mb-3">
                            <label for="vin" class="form-label">Enter VIN Code:</label>
                            <input type="text" id="vin" name="vin" class="form-control" placeholder="Enter VIN code" required>
                        </div>

                        <div class="text-center">
                            <button type="submit" class="btn btn-primary btn-lg">Find Car</button>
                        </div>
                    </form>

                    <div class="mt-4">
                        <p class="text-danger text-center" th:if="${error}" th:text="${error}"></p>
                    </div>
                </div>
            </div>

            <div class="mt-5">
                <div th:if="${car}">
                    <h4>Car Details</h4>
                    <ul class="list-group">
                        <li class="list-group-item"><strong>VIN:</strong> <span th:text="${car.vin}"></span></li>
                        <li class="list-group-item"><strong>Auction Name:</strong> <span th:text="${car.auctionName}"></span></li>
                        <li class="list-group-item"><strong>Auction Date:</strong> <span th:text="${car.auctionDate}"></span></li>
                        <li class="list-group-item"><strong>Shipping Ports:</strong> <span th:text="${car.shippingPorts}"></span></li>
                        <li class="list-group-item"><strong>Other Details:</strong> <span th:text="${car.otherDetails}"></span></li>
                    </ul>

                    <h5 class="mt-4">Car Photos</h5>
                    <div class="row">
                        <div class="col-md-4" th:each="photo : ${photos}">
                            <img th:src="@{${photo.url}}" class="img-fluid" alt="Car Photo">
                        </div>
                    </div>
                </div>

                <div th:if="${error}">
                    <div class="alert alert-danger" role="alert">
                        <p th:text="${error}"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="position-absolute top-0 end-0 m-4">
    <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#authModal">Add vehicle</button>
</div>

<div class="modal fade" id="authModal" tabindex="-1" aria-labelledby="authModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="authModalLabel">Доступ к добавлению ТС</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
            </div>
            <div class="modal-body">
                <label for="authPassword" class="form-label">Введите пароль:</label>
                <input type="password" id="authPassword" class="form-control" placeholder="Пароль">
                <div id="authError" class="text-danger mt-2" style="display: none;">Неверный пароль</div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                <button type="button" class="btn btn-primary" onclick="checkPassword()">Продолжить</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    function checkPassword() {
        const password = document.getElementById('authPassword').value;
        const correctPassword = 'secret123';

        if (password === correctPassword) {
            window.location.href = '/car/new';
        } else {
            document.getElementById('authError').style.display = 'block';
        }
    }
</script>

</body>
</html>
