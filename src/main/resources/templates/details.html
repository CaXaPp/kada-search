<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container my-5">
    <div class="card shadow-lg">
        <div class="card-header bg-primary text-white text-center">
            <h3>Car Details</h3>
        </div>
        <div class="card-body">
            <h5 class="card-title">Vehicle Information</h5>
            <table class="table table-bordered">
                <tbody>
                <tr>
                    <th>VIN</th>
                    <td><span th:text="${car.vin}">VIN</span></td>
                </tr>
                <tr>
                    <th>Auction Name</th>
                    <td><span th:text="${car.auctionName}">Auction Name</span></td>
                </tr>
                <tr>
                    <th>Auction Date</th>
                    <td><span th:text="${car.auctionDate}">Auction Date</span></td>
                </tr>
                <tr>
                    <th>Shipping Ports</th>
                    <td><span th:text="${car.shippingPorts}">Shipping Ports</span></td>
                </tr>
                <tr>
                    <th>Other Details</th>
                    <td><span th:text="${car.otherDetails}">Other Details</span></td>
                </tr>
                </tbody>
            </table>

            <h5 class="mt-4">Car Photos</h5>
            <div class="row">
                <div class="col-md-4" th:each="photo : ${photos}">
                    <img th:src="@{'/photo/' + ${photo.id}}" class="img-fluid rounded mb-3" alt="Car Photo"/>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
