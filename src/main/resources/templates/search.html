<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Search Car by VIN</title>
</head>
<body>
<h1>Search Car by VIN</h1>
<form action="/search" method="get">

    <input type="text" id="vin" name="vin" required />
    <button type="submit">Search</button>
</form>
</body>
</html>
