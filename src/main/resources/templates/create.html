<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Добавить автомобиль</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Добавить новый автомобиль</h4>
        </div>
        <div class="card-body">
            <form action="/car/new" method="post" enctype="multipart/form-data">
                <div class="mb-3">
                    <label for="vin" class="form-label">VIN</label>
                    <input type="text" id="vin" name="vin" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="auctionName" class="form-label">Название аукциона</label>
                    <input type="text" id="auctionName" name="auctionName" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="auctionDate" class="form-label">Дата аукциона</label>
                    <input type="date" id="auctionDate" name="auctionDate" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="shippingPorts" class="form-label">Порты отгрузки</label>
                    <input type="text" id="shippingPorts" name="shippingPorts" class="form-control">
                </div>

                <div class="mb-3">
                    <label for="otherDetails" class="form-label">Прочие детали</label>
                    <textarea id="otherDetails" name="otherDetails" class="form-control" rows="3"></textarea>
                </div>

                <div class="mb-3">
                    <label for="photos" class="form-label">Фотографии (можно выбрать несколько)</label>
                    <input type="file" id="photos" name="photos" class="form-control" multiple>
                </div>

                <button type="submit" class="btn btn-success">Сохранить</button>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
